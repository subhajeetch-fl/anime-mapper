# Cloudflare Worker configuration
# Deploy with: npx wrangler deploy

name = "anime-mapper-search"
main = "index.js"
compatibility_date = "2025-01-01"

# D1 Database (anime search index)
[[d1_databases]]
binding = "DB"
database_name = "animekun-db"
database_id = "7a656f0b-08e0-4f97-b168-c9936a5fb8ca"

# Secrets (set via `wrangler secret put API_KEY` locally):
#   API_KEY  - protects admin endpoints (/api/admin/*)

# Optional: custom domain (configure in Cloudflare dashboard after first deploy)
# [[routes]]
# pattern = "anime-mapper-search.your-subdomain.workers.dev"
# custom_domain = true
